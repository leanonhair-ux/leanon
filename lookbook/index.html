<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LEANON — Lookbook</title>
<meta name="description" content="LEANON 헤어 룩북 — 성수. Curate your own vibe." />
<meta property="og:title" content="LEANON — Lookbook" />
<meta property="og:description" content="LEANON 헤어 룩북. Curate your own vibe." />
<meta property="og:image" content="/assets/lookbook/2026/2026-01.jpg" />
<meta property="og:type" content="website" />
<style>
  :root{ --ink:#1a1a1a; --paper:#f2f0eb; --muted:#8c877d; --line:#e2ddd3; --line-strong:#cfc9bd; --maxw:1180px; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; min-height:100vh; min-height:100svh; background:var(--paper); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Pretendard","Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.7; font-weight:350;}
  a{color:inherit; text-decoration:none}
  img{display:block; max-width:100%}
  .eyebrow{font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); font-weight:500}

  /* NAV */
  header{position:sticky; top:0; z-index:60; background:rgba(244,242,238,.9); border-bottom:1px solid var(--line);
    backdrop-filter:saturate(140%) blur(6px); -webkit-backdrop-filter:saturate(140%) blur(6px);}
  .nav{max-width:var(--maxw); margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:60px}
  .nav .logo img{height:32px; width:auto}
  .nav .home{font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:#4a463f; border-bottom:1px solid transparent; padding-bottom:2px}
  .nav .home:hover{border-color:var(--ink); color:#000}

  /* HEAD */
  .lb-head{text-align:center; padding:56px 24px 10px}
  .lb-head h1{font-size:clamp(24px,4vw,34px); font-weight:300; letter-spacing:.16em; margin:10px 0 0; text-transform:uppercase}

  /* TABS */
  .tabs{display:flex; gap:10px; justify-content:center; margin:26px 0 6px}
  .tab{font-size:14px; letter-spacing:.12em; padding:9px 24px; border-radius:999px; border:1px solid var(--line-strong);
    background:transparent; color:#4a463f; cursor:pointer; transition:.18s; font-family:inherit}
  .tab:hover{border-color:var(--ink)}
  .tab.active{background:var(--ink); color:#fff; border-color:var(--ink)}

  /* GALLERY (masonry via columns) */
  .gallery-wrap{max-width:var(--maxw); margin:0 auto; padding:30px 16px 70px}
  .gallery{columns:3; column-gap:14px}
  @media(max-width:900px){ .gallery{columns:2} }
  @media(max-width:560px){ .gallery{columns:1} }
  .gallery figure{margin:0 0 14px; break-inside:avoid; border-radius:10px; overflow:hidden;
    box-shadow:0 8px 26px rgba(0,0,0,.08); cursor:zoom-in; background:#e7e3da; transition:transform .22s, box-shadow .22s}
  .gallery figure:hover{transform:translateY(-3px); box-shadow:0 14px 36px rgba(0,0,0,.14)}
  .gallery img{width:100%; height:auto; display:block}

  .empty{text-align:center; color:var(--muted); padding:80px 24px; font-size:15px; letter-spacing:.02em}

  /* LIGHTBOX */
  .lb{position:fixed; inset:0; z-index:200; background:rgba(20,19,17,.94); display:none; align-items:center; justify-content:center}
  .lb.open{display:flex}
  .lb img{max-width:92vw; max-height:88vh; width:auto; height:auto; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .x{position:absolute; top:18px; right:22px; font-size:30px; color:#fff; opacity:.85; cursor:pointer; line-height:1; user-select:none}
  .lb .x:hover{opacity:1}
  .lb .arw{position:absolute; top:50%; transform:translateY(-50%); font-size:40px; color:#fff; opacity:.7; cursor:pointer; user-select:none; padding:16px}
  .lb .arw:hover{opacity:1}
  .lb .prev{left:6px} .lb .next{right:6px}
  .lb .cnt{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#fff; opacity:.75; font-size:13px; letter-spacing:.1em}
  @media(max-width:560px){ .lb .arw{font-size:30px; padding:10px} }

  footer{text-align:center; padding:34px 24px 44px; color:var(--muted); font-size:11.5px; letter-spacing:.06em; border-top:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="/"><img src="/assets/brand/wordmark-dark.png" alt="LEANON" onerror="this.outerHTML='<span style=&quot;font-weight:700;letter-spacing:.28em;font-size:16px&quot;>LEANON</span>'" /></a>
    <a class="home" href="/">← Home</a>
  </div>
</header>

<div class="lb-head">
  <span class="eyebrow">Gallery</span>
  <h1>Lookbook</h1>
</div>

<div class="tabs" id="tabs">
  <button class="tab" data-year="2026">2026</button>
  <button class="tab" data-year="2025">2025</button>
</div>

<div class="gallery-wrap">
  <div class="gallery" id="gallery"></div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <span class="x" id="lbClose">&times;</span>
  <span class="arw prev" id="lbPrev">&#8249;</span>
  <img id="lbImg" src="" alt="LEANON Lookbook" />
  <span class="arw next" id="lbNext">&#8250;</span>
  <span class="cnt" id="lbCnt"></span>
</div>

<footer>© LEANON. All rights reserved.</footer>

<script>
  // 연도별 룩북 이미지 (파일 추가 시 배열에만 넣으면 됨)
  const LOOKS = {
    "2026": Array.from({length:14}, (_,i) => `/assets/lookbook/2026/2026-${String(i+1).padStart(2,'0')}.jpg`),
    "2025": Array.from({length:27}, (_,i) => `/assets/lookbook/2025/2025-${String(i+1).padStart(2,'0')}.jpg`)
  };

  const galleryEl = document.getElementById('gallery');
  const tabsEl = document.getElementById('tabs');
  let current = [];   // 현재 표시 중인 이미지 배열
  let year = "2026";

  function renderGallery(y){
    year = y;
    current = LOOKS[y] || [];
    [...tabsEl.children].forEach(b => b.classList.toggle('active', b.dataset.year === y));
    if(!current.length){
      galleryEl.innerHTML = `<div class="empty">${y} 룩북은 곧 공개됩니다.</div>`;
      return;
    }
    galleryEl.innerHTML = current.map((src, idx) =>
      `<figure data-idx="${idx}"><img src="${src}" alt="LEANON ${y} Lookbook ${idx+1}" loading="lazy"></figure>`
    ).join("");
  }

  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('.tab'); if(!btn) return;
    renderGallery(btn.dataset.year);
  });

  /* LIGHTBOX */
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lbImg');
  const lbCnt = document.getElementById('lbCnt');
  let lbIdx = 0;

  function openLb(idx){ lbIdx = idx; showLb(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
  function closeLb(){ lb.classList.remove('open'); document.body.style.overflow=''; }
  function showLb(){ lbImg.src = current[lbIdx]; lbCnt.textContent = `${lbIdx+1} / ${current.length}`; }
  function nav(d){ lbIdx = (lbIdx + d + current.length) % current.length; showLb(); }

  galleryEl.addEventListener('click', e => {
    const fig = e.target.closest('figure'); if(!fig) return;
    openLb(+fig.dataset.idx);
  });
  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); nav(-1); });
  document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); nav(1); });
  lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if(!lb.classList.contains('open')) return;
    if(e.key === 'Escape') closeLb();
    else if(e.key === 'ArrowLeft') nav(-1);
    else if(e.key === 'ArrowRight') nav(1);
  });

  // 초기: 최신 연도(2026)
  renderGallery("2026");
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LEANON — Careers</title>
<meta name="description" content="LEANON 채용 — 디자이너 · 주니어 지원 안내. 서울 성동구." />
<meta property="og:title" content="LEANON — Careers" />
<meta property="og:description" content="함께 성장할 디자이너와 주니어를 찾습니다." />
<meta property="og:image" content="/assets/hero/main.jpg" />
<meta property="og:type" content="website" />
<style>
  :root{ --ink:#1a1a1a; --paper:#f2f0eb; --muted:#8c877d; --line:#e2ddd3; --line-strong:#cfc9bd; --maxw:1080px; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; min-height:100vh; min-height:100svh; background:var(--paper); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Pretendard","Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.7; font-weight:350;
    display:flex; flex-direction:column;}
  a{color:inherit; text-decoration:none}
  img{display:block; max-width:100%}
  .eyebrow{font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); font-weight:500}

  /* NAV */
  header{position:sticky; top:0; z-index:60; background:rgba(244,242,238,.9); border-bottom:1px solid var(--line);
    backdrop-filter:saturate(140%) blur(6px); -webkit-backdrop-filter:saturate(140%) blur(6px);}
  .nav{max-width:var(--maxw); margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:60px}
  .nav .logo img{height:32px; width:auto}
  .nav .home{font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:#4a463f; border-bottom:1px solid transparent; padding-bottom:2px}
  .nav .home:hover{border-color:var(--ink); color:#000}

  /* MAIN */
  main{flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:64px 24px}
  .careers{width:100%; max-width:860px}
  .sec-head{text-align:center; margin-bottom:14px}
  .sec-head h1{font-size:clamp(24px,4vw,34px); font-weight:300; letter-spacing:.16em; margin:10px 0 0; text-transform:uppercase}
  .lead{text-align:center; color:#5a564e; margin:0 auto 48px; max-width:520px; font-size:15px}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:22px}
  @media(max-width:640px){ .cards{grid-template-columns:1fr; gap:18px} }

  .card{position:relative; display:flex; flex-direction:column; justify-content:space-between;
    border:1px solid var(--line-strong); border-radius:14px; background:#fff;
    padding:34px 30px 30px; min-height:230px; transition:.22s ease;}
  .card:hover{transform:translateY(-4px); box-shadow:0 16px 44px rgba(0,0,0,.10); border-color:var(--ink)}
  .card .role-en{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted)}
  .card .role-ko{font-size:23px; font-weight:400; letter-spacing:.02em; margin:8px 0 12px}
  .card .desc{font-size:13.5px; color:#6a655c; margin:0 0 26px; line-height:1.65}
  .card .go{display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
    font-size:13px; letter-spacing:.06em; padding:12px 22px; border-radius:999px;
    border:1px solid var(--ink); background:var(--ink); color:#fff; transition:.2s}
  .card:hover .go{background:#000}
  .card .go .arr{transition:transform .2s}
  .card:hover .go .arr{transform:translateX(4px)}

  footer{text-align:center; padding:34px 24px 42px; color:var(--muted); font-size:11.5px; letter-spacing:.06em}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="/"><img src="/assets/brand/wordmark-dark.png" alt="LEANON" onerror="this.outerHTML='<span style=&quot;font-weight:700;letter-spacing:.28em;font-size:16px&quot;>LEANON</span>'" /></a>
    <a class="home" href="/">← Home</a>
  </div>
</header>

<main>
  <div class="careers">
    <div class="sec-head"><span class="eyebrow">Careers</span><h1>Join LEANON</h1></div>
    <p class="lead">당신의 감각으로 함께 성장할 팀원을 찾습니다.<br/>지원하실 포지션을 선택해 주세요.</p>

    <div class="cards">
      <a class="card" href="/hire_designer">
        <div>
          <div class="role-en">Designer</div>
          <div class="role-ko">디자이너 지원하기</div>
          <p class="desc">면허 보유, 현장 경력이 있는<br/>스타일리스트/디자이너 포지션</p>
        </div>
        <span class="go">지원서 작성 <span class="arr">→</span></span>
      </a>

      <a class="card" href="/hire">
        <div>
          <div class="role-en">Junior</div>
          <div class="role-ko">주니어 지원하기</div>
          <p class="desc">기본기를 탄탄히 배우며<br/>디자이너로 성장할 인턴/스탭 포지션</p>
        </div>
        <span class="go">지원서 작성 <span class="arr">→</span></span>
      </a>
    </div>
  </div>
</main>

<footer>© LEANON. All rights reserved.</footer>

</body>
</html>

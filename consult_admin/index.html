<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LEANON — 상담 관리</title>

<!-- PWA (직원 앱) -->
<link rel="manifest" href="/consult_admin/manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<link rel="apple-touch-icon" href="/assets/app/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="LEANON" />
<meta name="mobile-web-app-capable" content="yes" />
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));}</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ color-scheme:light; --ink:#1c1a17; --muted:#8a8377; --line:#e6e1d9; --bg:#ffffff; --card:#f6f1ea; --radius:14px; }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
       background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased}

  /* 로그인 */
  #loginView{max-width:360px; margin:0 auto; padding:110px 24px}
  #loginView h1{font-size:26px; letter-spacing:5px; text-align:center; margin-bottom:6px}
  .loginlogo{width:160px; max-width:62%; height:auto; display:block; margin:0 auto 10px}
  #loginView p{text-align:center; color:var(--muted); font-size:13px; margin-bottom:32px}
  #loginView input{width:100%; border:1px solid var(--line); border-radius:10px; background:#fff;
       padding:14px; font-size:16px; margin-bottom:10px; font-family:inherit}
  #loginView button{width:100%; border:none; border-radius:10px; background:var(--ink); color:#fff;
       font-size:15px; font-weight:700; padding:15px; margin-top:6px; cursor:pointer}
  #loginErr{color:#c0392b; font-size:13px; text-align:center; margin-top:12px; min-height:18px}
  .remember{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); margin-top:12px; cursor:pointer; user-select:none}
  .remember input{width:auto !important; margin:0 !important; accent-color:var(--ink); width:16px; height:16px}

  /* 앱 */
  #appView{display:none}
  .topbar{position:sticky; top:0; z-index:5; background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
          border-bottom:1px solid var(--line); padding:14px 18px; display:flex; align-items:center; gap:12px}
  .topbar .logo{font-size:18px; letter-spacing:3px; font-weight:800}
  .topbar .toplogo{height:22px; width:auto; display:block}
  .topbar .sub{color:var(--muted); font-size:13px}
  .topbar .spacer{flex:1}
  .topbar button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px;
                 font-size:13px; cursor:pointer; font-family:inherit; white-space:nowrap}
  .filters{display:flex; flex-wrap:wrap; gap:8px; padding:14px 18px 4px}
  .fchip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px;
         font-size:13.5px; cursor:pointer; user-select:none}
  .fchip.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .filterbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 18px 2px}
  .filterbar .plabel{font-size:12px; color:var(--muted); margin-right:2px}
  .filterbar .dates{display:flex; flex-wrap:wrap; align-items:center; gap:6px; color:var(--muted); font-size:12px}
  .filterbar input[type=date]{border:1px solid var(--line); border-radius:8px; padding:6px 8px;
         font-size:12.5px; font-family:inherit; background:#fff; color:var(--ink)}
  .count{color:var(--muted); font-size:13px; padding:8px 18px 0}

  .grid{padding:14px 18px 60px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:12px}
  .chead{display:flex; align-items:flex-start; gap:10px}
  .cname{font-size:18px; font-weight:800}
  .cmeta{color:var(--muted); font-size:12.5px; margin-top:3px}
  .cdate{color:var(--muted); font-size:12px; margin-top:4px; font-variant-numeric:tabular-nums}
  .pill{margin-left:auto; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap}
  .p-wait{background:#ece5d8; color:#8a8377}
  .p-assigned{background:#e7f0ff; color:#2f6bd0}
  .p-done{background:#e6f6ea; color:#2f9e58}
  .p-hands{background:#fff1d6; color:#a06a0a; margin-left:6px}
  .pillrow{margin-left:auto; display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  .pillrow .pill{margin-left:0}
  .pillrow .pill+.pill{margin-left:6px}
  .handsbtn{margin-top:10px; width:100%; border:none; background:#f0c96a; color:#5a3d00; border-radius:8px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}
  .handsbtn.done{background:#fff8e8; color:#a06a0a; border:1.5px solid #f0c96a}
  .handsbtn:disabled{opacity:.5; cursor:default}

  .kv{font-size:13.5px; line-height:1.7}
  .kv .k{color:var(--muted); display:inline-block; min-width:96px}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px}
  .tag{font-size:12px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 8px}
  .cphotos{display:flex; flex-wrap:wrap; gap:8px; margin-top:5px}
  .cphotos a{display:block; width:78px; height:78px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
  .cphotos img{width:100%; height:100%; object-fit:cover; display:block}
  .cphotos .ph-msg{font-size:12.5px; color:var(--muted)}
  .memo{font-size:13px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; white-space:pre-wrap}
  .pasthead{display:flex; align-items:center; gap:8px}
  .transbtn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 9px;
            font-size:11.5px; cursor:pointer; font-family:inherit; color:var(--ink); white-space:nowrap}
  .transbtn:disabled{opacity:.5; cursor:default}
  .transresult{margin-top:6px; background:#f6f1ea}

  select, .note-in{border:1px solid var(--line); border-radius:8px; padding:9px; font-size:13.5px; font-family:inherit; background:#fff}
  .assign{display:flex; gap:9px; align-items:center; margin-top:4px; padding:11px 13px; border-radius:12px; transition:.15s}
  .assign .aicon{font-size:17px; line-height:1}
  .assign label{font-size:13px; font-weight:800; white-space:nowrap; letter-spacing:.3px}
  .assign select{flex:1; font-weight:700; font-size:14.5px; border-width:1.5px; background:#fff}
  .assign.unset{background:#fff4e2; border:1.5px solid #f0ad3c; box-shadow:0 2px 10px rgba(240,173,60,.18)}
  .assign.unset label{color:#b26a09}
  .assign.unset select{border-color:#f0ad3c; color:#b26a09}
  .assign.set{background:#e9f1ff; border:1.5px solid #6a9bea}
  .assign.set label{color:#2f6bd0}
  .assign.set select{border-color:#6a9bea; color:#2f6bd0}

  details.note{border-top:1px dashed var(--line); padding-top:10px}
  details.note summary{font-size:13px; font-weight:600; cursor:pointer; color:var(--ink)}
  .note-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
  .note-grid .full{grid-column:1/3}
  textarea.note-in{width:100%; min-height:60px; resize:vertical}
  .drawlabel{font-size:12px; color:var(--muted); margin:12px 0 6px}
  .drawpad{width:100%; aspect-ratio:600/360; background:#fff; border:1px solid var(--line);
           border-radius:10px; touch-action:none; display:block; cursor:crosshair}
  .draw-tools{display:flex; justify-content:flex-end; margin-top:6px}
  .clearpad{border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px;
            font-size:12.5px; cursor:pointer; font-family:inherit; color:var(--muted)}
  .savebtn{margin-top:12px; border:none; background:var(--ink); color:#fff; border-radius:8px; padding:11px; font-size:14px; font-weight:700; cursor:pointer; width:100%; font-family:inherit}
  .cardfoot{display:flex; justify-content:flex-end; margin-top:2px}
  .delbtn{border:none; background:transparent; color:#c0392b; font-size:12.5px; font-family:inherit; cursor:pointer; padding:6px 8px; border-radius:6px}
  .delbtn:hover{background:#fbeae8}
  .empty{text-align:center; color:var(--muted); padding:80px 20px; font-size:15px}

  /* 삭제 확인 모달 */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.42); display:none; align-items:center; justify-content:center; z-index:100; padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:#fff; border-radius:16px; padding:24px 22px 18px; max-width:340px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-title{font-size:17px; font-weight:800; margin-bottom:8px}
  .modal-body{font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:20px}
  .modal-actions{display:flex; gap:10px}
  .mbtn{flex:1; border:none; border-radius:10px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit}
  .mbtn.cancel{background:#f0ece4; color:var(--ink)}
  .mbtn.danger{background:#c0392b; color:#fff}
  .mbtn:disabled{opacity:.5}

  /* 뷰 전환 토글 (목록 / 대시보드) */
  .viewtoggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .viewtoggle .vbtn{border:none; border-radius:0; background:#fff; padding:8px 13px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--ink)}
  .viewtoggle .vbtn+.vbtn{border-left:1px solid var(--line)}
  .viewtoggle .vbtn.active{background:var(--ink); color:#fff}

  /* 대시보드 */
  #dashView{display:none; padding:20px 18px 60px; max-width:1280px}
  .dash-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:24px 36px; margin-top:22px}
  .dash-head{display:flex; align-items:baseline; gap:8px}
  .dash-total{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums}
  .dash-sub{color:var(--muted); font-size:13px}
  .dash-list{margin-top:6px; display:flex; flex-direction:column; gap:13px}
  .dash-row{display:grid; grid-template-columns:76px 1fr 40px; align-items:center; gap:12px}
  .dash-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dash-name.muted{color:var(--muted); font-weight:600}
  .dash-bar{height:26px; background:#efe9e0; border-radius:8px; overflow:hidden}
  .dash-fill{height:100%; background:var(--ink); border-radius:8px; min-width:2px; transition:width .3s}
  .dash-fill.muted{background:#c9c1b4}
  .dash-num{font-size:15px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums}
  .dash-empty{color:var(--muted); padding:60px 20px; text-align:center; font-size:15px}

  /* 대시보드: 추가 시술 의향 분포 */
  .dash-section{margin-top:0; min-width:0}
  .dash-sectitle{font-size:14px; font-weight:800; display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .dash-legend{display:flex; align-items:center; gap:12px; font-size:11.5px; font-weight:600; color:var(--muted)}
  .dash-legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px}
  .lg.more{background:#2f9e58} .lg.only{background:#c9c1b4} .lg.none{background:#efe9e0}
  .up-row{display:grid; grid-template-columns:76px 1fr 46px; align-items:center; gap:12px}
  .up-bar{height:26px; border-radius:8px; overflow:hidden; display:flex; background:#efe9e0}
  .up-seg{height:100%}
  .up-seg.more{background:#2f9e58} .up-seg.only{background:#c9c1b4}
  .up-counts{font-size:11px; color:var(--muted); margin-top:4px}
  .up-pct{font-size:14px; font-weight:800; text-align:right; color:#2f9e58; font-variant-numeric:tabular-nums}
  /* 빈도 분포(추구이미지/고민) — 라벨이 길어 이름칸 넓힘 + 줄바꿈 허용 */
  .freq .dash-row{grid-template-columns:96px 1fr 40px}
  .freq .dash-name{white-space:normal; line-height:1.25}

  /* 모바일 최적화 */
  @media (max-width:600px){
    .topbar{padding:12px 14px; gap:8px}
    .topbar .sub{display:none}
    .topbar button{padding:7px 10px; font-size:12.5px}
    .viewtoggle .vbtn{padding:7px 10px; font-size:12px}
    .filters{padding:12px 14px 4px}
    .filterbar{padding:6px 14px 2px}
    .count{padding:8px 14px 0}
    .grid{grid-template-columns:1fr; padding:12px 14px 72px; gap:12px}
    .card{padding:16px}
    .kv .k{min-width:82px}
  }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginView">
  <img class="loginlogo" src="../logo.png" alt="LEANON" onerror="this.outerHTML='&lt;h1&gt;LEANON&lt;/h1&gt;'" />
  <p>상담 관리 · 직원 전용</p>
  <input id="email" type="text" placeholder="아이디" autocomplete="username" autocapitalize="none" />
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
  <label class="remember"><input type="checkbox" id="remember" checked />로그인 정보 저장 · 자동 로그인</label>
  <button id="loginBtn">로그인</button>
  <div id="loginErr"></div>
</div>

<!-- 대시보드 -->
<div id="appView">
  <div class="topbar">
    <img class="toplogo" src="../logo.png" alt="LEANON" onerror="this.outerHTML='&lt;span class=&quot;logo&quot;&gt;LEANON&lt;/span&gt;'" />
    <span class="sub">상담 관리</span>
    <span class="spacer"></span>
    <div class="viewtoggle">
      <button class="vbtn active" data-v="list">목록</button>
      <button class="vbtn" data-v="dash">대시보드</button>
    </div>
    <button id="refreshBtn">새로고침</button>
    <button id="logoutBtn">로그아웃</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="filterbar" id="statusbar">
    <span class="plabel">상태</span>
    <div class="fchip" data-s="전체">전체</div>
    <div class="fchip" data-s="대기">대기</div>
    <div class="fchip" data-s="할당됨">디자이너 지정됨</div>
    <div class="fchip" data-s="상담완료">상담완료</div>
  </div>
  <div class="filterbar" id="handsbar">
    <span class="plabel">핸즈</span>
    <div class="fchip" data-h="전체">전체</div>
    <div class="fchip" data-h="완료">작성완료</div>
    <div class="fchip" data-h="미완료">미완료</div>
  </div>
  <div class="filterbar" id="periodbar">
    <span class="plabel">기간</span>
    <div class="fchip" data-p="all">전체기간</div>
    <div class="fchip" data-p="today">오늘</div>
    <div class="fchip" data-p="7d">최근 7일</div>
    <div class="fchip" data-p="month">이번 달</div>
    <span class="dates"><input type="date" id="fromDate"> ~ <input type="date" id="toDate"></span>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>

  <!-- 대시보드: 기간별 디자이너별 상담 수 -->
  <div id="dashView">
    <div class="dash-head">
      <span class="dash-total" id="dashTotal">0</span>
      <span class="dash-sub" id="dashSub">건</span>
    </div>
    <div class="dash-grid">
      <div class="dash-section">
        <div class="dash-sectitle">디자이너별 상담 수</div>
        <div class="dash-list" id="dashList"></div>
      </div>

      <div class="dash-section">
        <div class="dash-sectitle">추가 시술 의향
          <span class="dash-legend">
            <span><i class="lg more"></i>추가 희망</span>
            <span><i class="lg only"></i>예약만</span>
            <span><i class="lg none"></i>무응답</span>
          </span>
        </div>
        <div class="dash-list" id="dashUpsell"></div>
      </div>

      <div class="dash-section">
        <div class="dash-sectitle">연령대</div>
        <div class="dash-list" id="dashAge"></div>
      </div>

      <div class="dash-section">
        <div class="dash-sectitle">추구 이미지 <span class="dash-legend">최대 2개 선택 · 상담별 중복 집계</span></div>
        <div class="dash-list freq" id="dashImage"></div>
      </div>

      <div class="dash-section">
        <div class="dash-sectitle">고민 · 보완하고 싶은 점 <span class="dash-legend">복수 선택 가능</span></div>
        <div class="dash-list freq" id="dashConcern"></div>
      </div>
    </div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal-overlay" id="delModal">
  <div class="modal">
    <div class="modal-title">상담 삭제</div>
    <div class="modal-body" id="delMsg">이 상담을 삭제할까요?</div>
    <div class="modal-actions">
      <button class="mbtn cancel" id="delCancel">취소</button>
      <button class="mbtn danger" id="delConfirm">삭제</button>
    </div>
  </div>
</div>

<script>
  /* ═══════ 설정 ═══════ */
  const SUPABASE_URL = "https://xnwvogewpcylxadhyrxa.supabase.co";        // Supabase Project URL
  const SUPABASE_ANON_KEY = "sb_publishable_PHHLnd7TlayrQANxrkpm4w_4FlD4I-6";   // Supabase publishable key
  const DESIGNERS = ["정소현", "이하늘", "장영원", "조예진", "전영주", "천예은", "오기쁨"];  // 디자이너 명단 (수정)
  // 상담지 체크박스 옵션 (저장값은 언어 무관 한국어) — 대시보드 빈도 분포용
  const IMAGE_OPTS   = ["사랑스러운","여성스러운","모던/고급","힙/트렌디","영/캐주얼","개성/유니크","시크/전문적인","중성적인"];
  const CONCERN_OPTS = ["턱","광대","얼굴 길이","목 길이","두상","모질","모르겠어요"];
  const PHOTO_BUCKET = "consult-photos";   // 상담 첨부 사진 (비공개 Storage 버킷)

  const FACE = ["하트형","땅콩형","육각형","둥근형","마름모형","사각형","긴얼굴형","계란형"];
  const NECK = ["짧은 편","긴 편","얇은 편","두꺼운 편","승모근이 높은 편","적당한 편"];
  const HAIR = ["곱슬-웨이브형","곱슬-부푸는형","곱슬-가는형","반곱슬","직모","축모"];

  const sb = SUPABASE_URL ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let rows = [];
  let filter = "전체";
  let statusFilter = "전체";
  let handsFilter = "전체";
  let activePeriod = "all";
  let fromDate = null, toDate = null;
  let viewMode = "list";   // "list" | "dash"
  let pendingDelete = null;

  const $ = id => document.getElementById(id);
  const esc = s => (s==null?"":String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  function fmtDT(iso){ if(!iso) return ""; const d=new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

  /* ── 한국어 번역 (원문 언어 자동 감지 → 한국어) ── */
  async function translateToKo(text){
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=" + encodeURIComponent(text);
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return (data[0] || []).map(seg => seg[0]).join("");
  }

  /* ── 인증 ── */
  async function init(){
    if(!sb){ $("loginErr").textContent="Supabase 설정이 필요합니다 (SUPABASE_URL 입력)"; return; }
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ showApp(); return; }
    // 저장된 로그인 정보로 필드 채움 (+ 수동 로그아웃 아니면 자동 로그인)
    const saved = loadCreds();
    if(saved && saved.id){
      $("email").value = saved.id; $("password").value = saved.pw || ""; $("remember").checked = true;
      if(!loggedOut()){
        const { error } = await doLogin(saved.id, saved.pw);
        if(!error){ showApp(); return; }
        clearCreds();  // 저장된 정보가 더 이상 안 맞으면 폐기
      }
    }
    clearLogoutFlag();   // 플래그 1회 소비 (이후엔 다시 자동로그인 허용)
    showLogin();
  }
  function showLogin(){ $("loginView").style.display="block"; $("appView").style.display="none"; }
  function showApp(){ $("loginView").style.display="none"; $("appView").style.display="block"; renderFilters(); renderStatusChips(); renderHandsChips(); renderPeriodChips(); load(); }

  // 아이디만 입력하면 자동으로 로그인용 도메인을 붙임 (직원은 이메일 외울 필요 없음)
  const toEmail = v => { v=(v||"").trim(); return v.includes("@") ? v : v+"@leanon.co.kr"; };

  // 로그인 정보 저장 (이 기기에만, 가벼운 인코딩)
  const CRED_KEY = "leanon_admin_cred";
  const LOGOUT_KEY = "leanon_admin_logout";   // 수동 로그아웃 표시 → 재실행 시 자동로그인 1회 건너뜀
  function saveCreds(id, pw){ try{ localStorage.setItem(CRED_KEY, btoa(unescape(encodeURIComponent(JSON.stringify({id,pw}))))); }catch(_){} }
  function loadCreds(){ try{ const s=localStorage.getItem(CRED_KEY); return s ? JSON.parse(decodeURIComponent(escape(atob(s)))) : null; }catch(_){ return null; } }
  function clearCreds(){ try{ localStorage.removeItem(CRED_KEY); }catch(_){} }
  function setLogoutFlag(){ try{ localStorage.setItem(LOGOUT_KEY, "1"); }catch(_){} }
  function clearLogoutFlag(){ try{ localStorage.removeItem(LOGOUT_KEY); }catch(_){} }
  function loggedOut(){ try{ return localStorage.getItem(LOGOUT_KEY)==="1"; }catch(_){ return false; } }

  async function doLogin(id, pw){
    return await sb.auth.signInWithPassword({ email:toEmail(id), password:pw });
  }
  $("loginBtn").onclick = async () => {
    $("loginErr").textContent="";
    const id = $("email").value.trim(), pw = $("password").value;
    const { error } = await doLogin(id, pw);
    if(error){ $("loginErr").textContent="로그인 실패: 아이디/비밀번호를 확인해 주세요."; return; }
    if($("remember").checked) saveCreds(id, pw); else clearCreds();
    clearLogoutFlag();   // 수동 로그인 → 다음 실행부터 자동로그인 허용
    showApp();
  };
  $("password").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginBtn").click(); });
  // 로그아웃: 세션만 끊고 저장된 id/pw는 유지 (다음 로그인 때 자동 입력). 재실행 시 자동로그인은 1회 건너뜀
  $("logoutBtn").onclick = async () => {
    setLogoutFlag();
    await sb.auth.signOut();
    const saved = loadCreds();
    if(saved && saved.id){ $("email").value = saved.id; $("password").value = saved.pw || ""; $("remember").checked = true; }
    showLogin();
  };
  $("refreshBtn").onclick = () => load();

  /* ── 디자이너 필터 ── */
  function renderFilters(){
    const items = ["전체", ...DESIGNERS];
    $("filters").innerHTML = items.map(n =>
      `<div class="fchip ${n===filter?'active':''}" data-f="${esc(n)}">${n==="전체"?"전체 (매니저)":esc(n)}</div>`).join("");
    $("filters").querySelectorAll(".fchip").forEach(c => c.onclick = () => { filter=c.dataset.f; renderFilters(); render(); });
  }

  /* ── 상태 필터 ── */
  function renderStatusChips(){
    document.querySelectorAll("#statusbar .fchip").forEach(c => c.classList.toggle("active", c.dataset.s===statusFilter));
  }
  document.querySelectorAll("#statusbar .fchip").forEach(c => c.onclick = () => { statusFilter=c.dataset.s; renderStatusChips(); render(); });

  /* ── 핸즈 필터 (상태와 독립) ── */
  function renderHandsChips(){
    document.querySelectorAll("#handsbar .fchip").forEach(c => c.classList.toggle("active", c.dataset.h===handsFilter));
  }
  document.querySelectorAll("#handsbar .fchip").forEach(c => c.onclick = () => { handsFilter=c.dataset.h; renderHandsChips(); render(); });

  /* ── 기간 필터 ── */
  function renderPeriodChips(){
    document.querySelectorAll("#periodbar .fchip").forEach(c => c.classList.toggle("active", c.dataset.p===activePeriod));
  }
  function setPeriod(p){
    const now = new Date();
    if(p==="all"){ fromDate=null; toDate=null; }
    else if(p==="today"){ fromDate=ymd(now); toDate=ymd(now); }
    else if(p==="7d"){ const s=new Date(now); s.setDate(s.getDate()-6); fromDate=ymd(s); toDate=ymd(now); }
    else if(p==="month"){ fromDate=ymd(new Date(now.getFullYear(), now.getMonth(), 1)); toDate=ymd(now); }
    activePeriod = p;
    $("fromDate").value = fromDate||""; $("toDate").value = toDate||"";
    render();
  }
  document.querySelectorAll("#periodbar .fchip").forEach(c => c.onclick = () => { setPeriod(c.dataset.p); renderPeriodChips(); });
  $("fromDate").onchange = () => { fromDate=$("fromDate").value||null; activePeriod="custom"; renderPeriodChips(); render(); };
  $("toDate").onchange   = () => { toDate=$("toDate").value||null; activePeriod="custom"; renderPeriodChips(); render(); };
  function inPeriod(r){
    if(!fromDate && !toDate) return true;
    const t = new Date(r.created_at);
    if(fromDate && t < new Date(fromDate+"T00:00:00")) return false;
    if(toDate && t > new Date(toDate+"T23:59:59.999")) return false;
    return true;
  }
  function periodLabel(){
    if(!fromDate && !toDate) return "전체기간";
    if(fromDate && toDate && fromDate===toDate) return fromDate;
    return `${fromDate||"처음"} ~ ${toDate||"오늘"}`;
  }

  /* ── 뷰 전환 (목록 / 대시보드) ── */
  function setView(v){
    viewMode = v;
    document.querySelectorAll(".viewtoggle .vbtn").forEach(b => b.classList.toggle("active", b.dataset.v===v));
    const dash = v==="dash";
    // 디자이너 필터(#filters)는 대시보드에서도 사용 → 숨기지 않음. 상태 필터는 목록 전용
    ["statusbar","handsbar","count","grid"].forEach(id => $(id).style.display = dash ? "none" : "");
    $("dashView").style.display = dash ? "block" : "none";
    render();
  }
  document.querySelectorAll(".viewtoggle .vbtn").forEach(b => b.onclick = () => setView(b.dataset.v));

  /* ── 삭제 모달 ── */
  function openDelModal(r){
    pendingDelete = r;
    $("delMsg").textContent = `'${r.name||"이 고객"}' 님의 상담을 삭제할까요? 삭제하면 복구할 수 없습니다.`;
    $("delConfirm").disabled = false; $("delConfirm").textContent = "삭제";
    $("delModal").classList.add("open");
  }
  function closeDelModal(){ $("delModal").classList.remove("open"); pendingDelete = null; }
  $("delCancel").onclick = closeDelModal;
  $("delModal").onclick = e => { if(e.target===$("delModal")) closeDelModal(); };
  $("delConfirm").onclick = async () => {
    const r = pendingDelete; if(!r) return;
    $("delConfirm").disabled = true; $("delConfirm").textContent = "삭제 중...";
    const { error } = await sb.from("consultations").delete().eq("id", r.id);
    if(error){ alert("삭제 오류: "+error.message); $("delConfirm").disabled=false; $("delConfirm").textContent="삭제"; return; }
    rows = rows.filter(x => x.id !== r.id);
    closeDelModal(); render();
  };

  /* ── 데이터 로드 ── */
  async function load(){
    const { data, error } = await sb.from("consultations").select("*").order("created_at",{ascending:false});
    if(error){ $("grid").innerHTML=`<div class="empty">불러오기 오류: ${esc(error.message)}</div>`; return; }
    rows = data || [];
    render();
  }

  /* ── 렌더 ── */
  function render(){
    if(viewMode==="dash"){ renderDash(); return; }
    let list = filter==="전체" ? rows : rows.filter(r => r.assigned_designer===filter);
    if(statusFilter!=="전체") list = list.filter(r => (r.status||"대기")===statusFilter);
    if(handsFilter==="완료")  list = list.filter(r => r.hands_done===true);
    else if(handsFilter==="미완료") list = list.filter(r => r.hands_done!==true);
    list = list.filter(inPeriod);
    $("count").textContent = `${list.length}건`;
    if(!list.length){ $("grid").innerHTML=`<div class="empty">해당 조건의 상담이 없어요.</div>`; return; }
    $("grid").innerHTML = list.map(cardHTML).join("");
    list.forEach(bind);
  }

  /* ── 대시보드: 기간별 디자이너별 상담 수 + 추가시술 의향 분포 ── */
  function renderDash(){
    // 디자이너 필터(전체=기본) 적용 → 선택 시 그 디자이너 상담만 집계
    const base = filter==="전체" ? rows : rows.filter(r => r.assigned_designer===filter);
    const list = base.filter(inPeriod);
    // 디자이너별 집계 (건수 + 오늘 시술 의향). today 저장값은 언어 무관 한국어 → 부분일치로 분류
    const stat = new Map();   // name -> {n, more, only}
    DESIGNERS.forEach(d => stat.set(d, {n:0, more:0, only:0}));
    let unassigned = 0;
    list.forEach(r => {
      const d = r.assigned_designer;
      if(!d){ unassigned++; return; }
      if(!stat.has(d)) stat.set(d, {n:0, more:0, only:0});
      const s = stat.get(d); s.n++;
      const t = r.today || "";
      if(t.includes("추가")) s.more++;
      else if(t.includes("예약")) s.only++;
    });

    // 1) 건수 분포 (전체일 땐 0건 디자이너도 표시, 특정 디자이너 선택 시 그 사람만)
    let entries = [...stat.entries()].map(([name,s]) => ({name, n:s.n, muted:false}));
    if(filter!=="전체") entries = entries.filter(e => e.n>0);
    entries.sort((a,b) => b.n - a.n || a.name.localeCompare(b.name,'ko'));
    if(unassigned>0) entries.push({name:"미배정", n:unassigned, muted:true});
    const total = list.length;
    const max = Math.max(1, ...entries.map(e => e.n));
    $("dashTotal").textContent = total;
    $("dashSub").textContent = `건 · ${periodLabel()}`;
    if(!total){
      $("dashList").innerHTML = `<div class="dash-empty">해당 기간에 작성된 상담이 없어요.</div>`;
      ["dashUpsell","dashAge","dashImage","dashConcern"].forEach(id => $(id).innerHTML = "");
      return;
    }
    $("dashList").innerHTML = entries.map(e => `
      <div class="dash-row">
        <div class="dash-name ${e.muted?'muted':''}">${esc(e.name)}</div>
        <div class="dash-bar"><div class="dash-fill ${e.muted?'muted':''}" style="width:${(e.n/max*100).toFixed(1)}%"></div></div>
        <div class="dash-num">${e.n}</div>
      </div>`).join("");

    // 1-2) 연령대 / 추구 이미지 / 고민 빈도 분포 (전체)
    renderAge("dashAge", list, total);
    renderFreq("dashImage", list, "image", IMAGE_OPTS, total);
    renderFreq("dashConcern", list, "concern", CONCERN_OPTS, total);

    // 2) 추가 시술 의향 분포 (담당 지정된 디자이너별, 각자 상담 대비 비율)
    let up = [...stat.entries()].map(([name,s]) => ({name, ...s})).filter(e => e.n>0);
    up.sort((a,b) => b.n - a.n || a.name.localeCompare(b.name,'ko'));
    if(!up.length){
      $("dashUpsell").innerHTML = `<div class="dash-empty">담당 지정된 상담이 아직 없어요.</div>`;
      return;
    }
    $("dashUpsell").innerHTML = up.map(e => {
      const none = e.n - e.more - e.only;
      const morePct = e.more / e.n * 100, onlyPct = e.only / e.n * 100;
      const counts = `추가 ${e.more} · 예약만 ${e.only}${none?` · 무응답 ${none}`:``} (총 ${e.n})`;
      return `
      <div class="up-row">
        <div class="dash-name">${esc(e.name)}</div>
        <div>
          <div class="up-bar" title="${counts}">
            <div class="up-seg more" style="width:${morePct.toFixed(1)}%"></div>
            <div class="up-seg only" style="width:${onlyPct.toFixed(1)}%"></div>
          </div>
          <div class="up-counts">${counts}</div>
        </div>
        <div class="up-pct">${Math.round(morePct)}%</div>
      </div>`;
    }).join("");
  }

  // 저장값을 배열로 정규화 (배열 / JSON 문자열 / "a, b" 문자열 모두 대응)
  function asArr(v){
    if(Array.isArray(v)) return v;
    if(v==null || v==="") return [];
    if(typeof v==="string"){
      try{ const p=JSON.parse(v); if(Array.isArray(p)) return p; }catch(_){}
      return v.split(",").map(s=>s.trim()).filter(Boolean);
    }
    return [];
  }
  // 생년월일 자유텍스트에서 출생연도 추출 (1996.03.21 / 1996-3-21 / 960321 / 96.03.21 등)
  function birthYear(v){
    if(v==null) return null;
    const s = String(v).trim();
    let m = s.match(/(19\d{2}|20\d{2})/);          // 4자리 연도 우선
    if(m) return parseInt(m[1],10);
    const nowYY = new Date().getFullYear() % 100;
    m = s.match(/^(\d{2})(?:[.\-\/]|\d{4}$)/);       // 2자리 연도 (YY.MM.DD / YYMMDD)
    if(m){ const yy=parseInt(m[1],10); return yy<=nowYY ? 2000+yy : 1900+yy; }
    return null;
  }
  function ageGroup(birth, nowY){
    const y = birthYear(birth);
    if(!y) return "미상";
    const age = nowY - y;
    if(age < 0 || age > 120) return "미상";
    if(age < 20) return "10대";
    if(age < 30) return "20대";
    if(age < 40) return "30대";
    if(age < 50) return "40대";
    return "50대+";
  }
  // 연령대 분포 (연령 오름차순 고정 순서)
  function renderAge(containerId, list, total){
    const order = ["10대","20대","30대","40대","50대+","미상"];
    const cnt = new Map(order.map(b => [b, 0]));
    const nowY = new Date().getFullYear();
    list.forEach(r => { const g = ageGroup(r.birth, nowY); cnt.set(g, cnt.get(g)+1); });
    let entries = order.map(b => ({name:b, n:cnt.get(b)})).filter(e => !(e.name==="미상" && e.n===0));
    const max = Math.max(1, ...entries.map(e => e.n));
    if(!entries.some(e => e.n>0)){ $(containerId).innerHTML = `<div class="dash-empty">응답 데이터가 없어요.</div>`; return; }
    $(containerId).innerHTML = entries.map(e => {
      const m = e.name==="미상" ? "muted" : "";
      return `
      <div class="dash-row">
        <div class="dash-name ${m}">${esc(e.name)}</div>
        <div class="dash-bar" title="${e.n}건 · 상담의 ${total?Math.round(e.n/total*100):0}%"><div class="dash-fill ${m}" style="width:${(e.n/max*100).toFixed(1)}%"></div></div>
        <div class="dash-num">${e.n}</div>
      </div>`;
    }).join("");
  }
  // 체크박스 항목 빈도 분포 (복수선택이라 상담별 중복 집계)
  function renderFreq(containerId, list, field, options, total){
    const cnt = new Map();
    options.forEach(o => cnt.set(o, 0));
    list.forEach(r => asArr(r[field]).forEach(v => cnt.set(v, (cnt.get(v)||0) + 1)));
    let entries = [...cnt.entries()].map(([name,n]) => ({name, n}));
    entries.sort((a,b) => b.n - a.n || options.indexOf(a.name) - options.indexOf(b.name));
    const max = Math.max(1, ...entries.map(e => e.n));
    if(!entries.some(e => e.n>0)){ $(containerId).innerHTML = `<div class="dash-empty">응답 데이터가 없어요.</div>`; return; }
    $(containerId).innerHTML = entries.map(e => `
      <div class="dash-row">
        <div class="dash-name">${esc(e.name)}</div>
        <div class="dash-bar" title="${e.n}건 · 상담의 ${total?Math.round(e.n/total*100):0}%">
          <div class="dash-fill" style="width:${(e.n/max*100).toFixed(1)}%"></div>
        </div>
        <div class="dash-num">${e.n}</div>
      </div>`).join("");
  }

  function arr(a){ return Array.isArray(a)&&a.length ? a.map(x=>`<span class="tag">${esc(x)}</span>`).join("") : '<span class="cmeta">-</span>'; }
  function statusPill(s){
    if(s==="상담완료") return '<span class="pill p-done">상담완료</span>';
    if(s==="할당됨")   return '<span class="pill p-assigned">디자이너 지정됨</span>';
    return '<span class="pill p-wait">대기</span>';
  }
  function handsPill(r){
    if(r.hands_done!==true) return "";
    const ts = r.hands_done_at ? ` (${fmtDT(r.hands_done_at)})` : "";
    return `<span class="pill p-hands" title="핸즈 작성완료${ts}">핸즈완료</span>`;
  }

  function cardHTML(r){
    const n = r.designer_note || {};
    const opt = (list,sel)=>['<option value="">선택</option>',...list.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`)].join("");
    return `<div class="card" data-id="${r.id}">
      <div class="chead">
        <div>
          <div class="cname">${esc(r.name)||"(이름없음)"}</div>
          <div class="cmeta">${esc(r.birth)||""} · ${esc(r.region_si)||""} ${esc(r.region_gu)||""}</div>
          <div class="cdate">🕓 ${fmtDT(r.created_at)} 제출</div>
        </div>
        <div class="pillrow">${statusPill(r.status)}${handsPill(r)}</div>
      </div>

      <div class="kv">
        <div><span class="k">마지막 시술</span> 컷 ${r.last_cut??"-"}개월 · 펌 ${r.last_perm??"-"}개월 · 컬러 ${r.last_color??"-"}개월 ${r.color_type?`(${esc(r.color_type)})`:""}</div>
        <div><span class="k">레퍼런스</span> ${esc(r.reference)||"-"}</div>
        <div><span class="k">오늘 시술</span> ${esc(r.today)||"-"}</div>
        <div><span class="k">기장감</span> ${esc(r.length)||"-"}</div>
      </div>
      ${asArr(r.photos).length?`<div><div class="cmeta">첨부 사진</div><div class="cphotos" data-ph="${r.id}"><span class="ph-msg">📷 ${asArr(r.photos).length}장 불러오는 중…</span></div></div>`:""}
      <div><div class="cmeta">추구 이미지</div><div class="tags">${arr(r.image)}</div></div>
      <div><div class="cmeta">고민/보완</div><div class="tags">${arr(r.concern)}</div></div>
      <div><div class="cmeta">평소 스타일링</div><div class="tags">${arr(r.styling)}</div></div>
      ${r.past?`<div>
        <div class="cmeta pasthead">과거 불만족 <button type="button" class="transbtn">한글로 번역</button></div>
        <div class="memo">${esc(r.past)}</div>
        <div class="memo transresult" style="display:none"></div>
      </div>`:""}

      <div class="assign ${r.assigned_designer?'set':'unset'}">
        <span class="aicon">${r.assigned_designer?'✓':'👤'}</span>
        <label>담당 디자이너</label>
        <select class="assignSel">${opt(DESIGNERS, r.assigned_designer)}</select>
      </div>

      <details class="note">
        <summary>DESIGNER'S NOTE ${n.face||n.neck||n.hair||n.memo||n.drawing?"✓":""}</summary>
        <div class="note-grid">
          <select class="nFace">${opt(FACE, n.face)}</select>
          <select class="nNeck">${opt(NECK, n.neck)}</select>
          <select class="nHair full">${opt(HAIR, n.hair)}</select>
          <textarea class="note-in full nMemo" placeholder="메모 (얼굴 비율/특이사항 등)">${esc(n.memo)}</textarea>
        </div>
        <div class="drawlabel">✏️ 그림 / 손글씨 (애플펜슬)</div>
        <canvas class="drawpad" width="600" height="360"></canvas>
        <div class="draw-tools"><button type="button" class="clearpad">전체 지우기</button></div>
        <button class="savebtn">저장 (상담완료 처리)</button>
      </details>

      <button class="handsbtn ${r.hands_done?'done':''}">${r.hands_done ? `✓ 핸즈 작성완료${r.hands_done_at?` · ${fmtDT(r.hands_done_at)}`:""} (해제)` : '핸즈작성완료'}</button>
    </div>`;
  }

  /* ── 필기 캔버스 초기화 ── */
  function initPad(pad, existing){
    const ctx = pad.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,pad.width,pad.height);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1c1a17";
    if(existing){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, pad.width, pad.height); img.src = existing; }
    let drawing = false, lx = 0, ly = 0;
    const P = e => { const rc = pad.getBoundingClientRect(); return { x:(e.clientX-rc.left)*(pad.width/rc.width), y:(e.clientY-rc.top)*(pad.height/rc.height) }; };
    pad.addEventListener("pointerdown", e => { e.preventDefault(); drawing=true; const p=P(e); lx=p.x; ly=p.y; try{ pad.setPointerCapture(e.pointerId); }catch(_){}
      ctx.beginPath(); ctx.arc(lx,ly,1.3,0,Math.PI*2); ctx.fillStyle="#1c1a17"; ctx.fill(); });
    pad.addEventListener("pointermove", e => { if(!drawing) return; e.preventDefault(); const p=P(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; });
    const end = () => { drawing=false; };
    pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end); pad.addEventListener("pointerleave", end);
    pad._clear = () => { ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,pad.width,pad.height); ctx.strokeStyle="#1c1a17"; };
    return ctx;
  }

  // 첨부 사진: 비공개 버킷 경로 → 서명URL 생성 후 썸네일 표시 (클릭 시 원본 새 탭)
  async function loadPhotos(card, r){
    const box = card.querySelector(".cphotos"); if(!box) return;
    const paths = asArr(r.photos);
    if(!paths.length){ box.remove(); return; }
    const { data, error } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths, 3600);
    if(error || !data){ box.innerHTML = '<span class="ph-msg">사진을 불러오지 못했어요.</span>'; return; }
    const html = data.map(d => d.signedUrl
      ? `<a href="${d.signedUrl}" target="_blank" rel="noopener"><img src="${d.signedUrl}" alt="상담 사진" loading="lazy"></a>` : "").join("");
    box.innerHTML = html || '<span class="ph-msg">사진을 불러오지 못했어요.</span>';
  }

  function bind(r){
    const card = $("grid").querySelector(`.card[data-id="${r.id}"]`);
    if(!card) return;
    const n = r.designer_note || {};
    if(asArr(r.photos).length) loadPhotos(card, r);

    // 필기 캔버스
    const pad = card.querySelector(".drawpad");
    initPad(pad, n.drawing);
    card.querySelector(".clearpad").onclick = () => pad._clear();

    // 핸즈 작성완료 토글 (상태와 독립)
    card.querySelector(".handsbtn").onclick = async () => {
      const btn = card.querySelector(".handsbtn");
      const next = !r.hands_done;
      btn.disabled = true;
      const patch = { hands_done: next, hands_done_at: next ? new Date().toISOString() : null };
      const { error } = await sb.from("consultations").update(patch).eq("id", r.id);
      btn.disabled = false;
      if(error) return alert("핸즈 상태 저장 오류: "+error.message);
      Object.assign(r, patch); render();
    };

    // 할당
    card.querySelector(".assignSel").onchange = async e => {
      const name = e.target.value || null;
      const status = name ? (r.status==="상담완료"?"상담완료":"할당됨") : "대기";
      const { error } = await sb.from("consultations").update({ assigned_designer:name, status }).eq("id", r.id);
      if(error) return alert("할당 오류: "+error.message);
      r.assigned_designer=name; r.status=status; render();
    };
    // 노트 저장 (그림 포함)
    card.querySelector(".savebtn").onclick = async () => {
      const btn = card.querySelector(".savebtn");
      btn.disabled = true; btn.textContent = "저장 중...";
      const note = {
        face: card.querySelector(".nFace").value,
        neck: card.querySelector(".nNeck").value,
        hair: card.querySelector(".nHair").value,
        memo: card.querySelector(".nMemo").value,
        drawing: pad.toDataURL("image/png")
      };
      const { error } = await sb.from("consultations").update({ designer_note:note, status:"상담완료" }).eq("id", r.id);
      btn.disabled = false; btn.textContent = "저장 (상담완료 처리)";
      if(error) return alert("저장 오류: "+error.message);
      r.designer_note=note; r.status="상담완료"; render();
    };
    // 과거 불만족 한글 번역
    const transBtn = card.querySelector(".transbtn");
    if(transBtn){
      transBtn.onclick = async () => {
        const box = card.querySelector(".transresult");
        transBtn.disabled = true; transBtn.textContent = "번역 중...";
        try {
          const ko = await translateToKo(r.past);
          box.textContent = ko;
          box.style.display = "block";
          transBtn.textContent = "번역 완료";
        } catch(err) {
          box.textContent = "번역 실패: " + err.message;
          box.style.display = "block";
          transBtn.disabled = false; transBtn.textContent = "다시 번역";
        }
      };
    }
  }

  init();
</script>
</body>
</html>
